<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | Avocatu'</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7a1f2b">
</head>
<body>
<div class="chat-wrap">
  <header class="nav">
    <a class="logo" href="index.html"><span class="mark">§</span> Avocatu'</a>
    <div class="tools"><button class="link" id="clear" type="button">Șterge istoricul</button></div>
  </header>

  <div id="log"><div class="msgs" id="msgs"></div></div>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Scrie întrebarea ta juridică..." autofocus></textarea>
      <button class="btn" type="submit" id="send">Trimite</button>
    </form>
    <div class="note">Avocatu' poate greși. Verifică articolele pe legislatie.just.ro. Nu este un substitut pentru un avocat.</div>
  </div>
</div>

<script>
const KEY = "avocatu_history_v1";
const msgsEl = document.getElementById("msgs");
const logEl = document.getElementById("log");
const input = document.getElementById("input");
const form = document.getElementById("form");
const sendBtn = document.getElementById("send");
const SUGGESTIONS = [
  "Care sunt pașii pentru înființarea unui SRL?",
  "Pot fi concediat în perioada de probă fără preaviz?",
  "Cum contest o amendă contravențională?",
  "Ce drepturi am ca chiriaș?"
];
let history = [];
try { history = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { history = []; }

function md(text){
  const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = (l) => l.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>");
  const out = []; let list = false;
  for (const raw of esc.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + inline(m[1]) + "</li>");
      continue;
    }
    if (list) { out.push("</ul>"); list = false; }
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) out.push("<h4>" + inline(m[1]) + "</h4>");
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) out.push("<hr>");
    else if (line.trim() === "") out.push("");
    else out.push("<p>" + inline(line) + "</p>");
  }
  if (list) out.push("</ul>");
  return out.join("");
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(history)); } catch {} }
function addBubble(role, text, cls){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot") + (cls ? " " + cls : "");
  if (role === "user" || cls) d.textContent = text; else d.innerHTML = md(text);
  msgsEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function renderEmpty(){
  msgsEl.innerHTML = "";
  const e = document.createElement("div");
  e.className = "empty";
  e.innerHTML = "<h2>Cu ce te pot ajuta?</h2><p>Întreabă despre legislația din România.</p>";
  const chips = document.createElement("div");
  chips.className = "chips";
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => ask(s);
    chips.appendChild(b);
  });
  e.appendChild(chips);
  msgsEl.appendChild(e);
}
function renderAll(){
  if (!history.length) return renderEmpty();
  msgsEl.innerHTML = "";
  history.forEach(m => addBubble(m.role, m.content));
}


// ---- Direct mode: used when there is no backend (e.g. GitHub Pages). The visitor's own free
// Gemini key stays in this browser (localStorage) and is sent only to Google. ----
const SYSTEM = `Ești Avocatu', un asistent juridic virtual specializat în legislația din România.
Reguli:
- Răspunde în limba utilizatorului (implicit română), clar, pe înțelesul unui nespecialist, dar riguros.
- Structura răspunsului: (1) răspuns scurt, (2) explicație, (3) temei legal cu articole concrete
  (ex: Codul civil, art. X; Codul muncii, art. Y; Legea nr. 31/1990, art. Z), (4) pași practici.
- Citează doar texte legale despre care ești sigur. Dacă nu ești sigur de numărul unui articol sau de
  versiunea în vigoare, spune explicit asta și recomandă verificarea pe legislatie.just.ro.
- Nu inventa articole, hotărâri sau jurisprudență.
- Semnalează când legislația ar fi putut fi modificată recent.
- La final, pentru situații complexe sau litigii, recomandă consultarea unui avocat. Nu ești un avocat
  și nu oferi reprezentare sau consultanță juridică personalizată.`;
const KEY_NAME = "avocatu_gemini_key";
const PRIMARY_MODEL = "gemini-3.8-flash";
const G = "https://generativelanguage.googleapis.com/v1beta/models";
let directMode = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function getKey(){
  let k = ""; try { k = localStorage.getItem(KEY_NAME) || ""; } catch {}
  if (!k) {
    k = (prompt("Chatul rulează fără server. Lipește cheia ta GRATUITĂ Gemini (aistudio.google.com/apikey). Rămâne doar în browserul tău.") || "").trim();
    if (!k) throw new Error("Este nevoie de o cheie Gemini gratuită pentru a folosi chatul pe această pagină.");
    try { localStorage.setItem(KEY_NAME, k); } catch {}
  }
  return k;
}
function forgetKey(){ try { localStorage.removeItem(KEY_NAME); } catch {} }

async function callGemini(model, key, messages, onText){
  const r = await fetch(`${G}/${model}:streamGenerateContent?alt=sse`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM }] },
      contents: messages.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
      generationConfig: { maxOutputTokens: 1500 }
    })
  });
  if (!r.ok) {
    const e = new Error(`Gemini ${r.status}: ` + (await r.text()).replace(/\s+/g, " ").slice(0, 250));
    e.status = r.status; throw e;
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n"); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith("data:")) continue;
      const d = l.slice(5).trim(); if (!d) continue;
      const parts = JSON.parse(d).candidates?.[0]?.content?.parts || [];
      const t = parts.map(p => p.text || "").join("");
      if (t) onText(t);
    }
  }
}

async function directGemini(messages, onText){
  const key = getKey();
  let started = false;
  const emit = t => { started = true; onText(t); };
  const transient = e => [503, 429, 500, 404].includes(e.status);
  const tryModel = async (model, retries) => {
    for (let a = 0; ; a++) {
      try { await callGemini(model, key, messages, emit); return true; }
      catch (e) {
        if (e.status === 400 || e.status === 403) { forgetKey(); throw new Error("Cheia Gemini nu este validă. Reîncearcă și lipește o cheie nouă."); }
        if (!transient(e) || started) throw e;
        if (a >= retries) return false;
        await sleep(1500 * (a + 1));
      }
    }
  };
  if (await tryModel(PRIMARY_MODEL, 2)) return;
  let others = [];
  try {
    const j = await (await fetch(`${G}?pageSize=200`, { headers: { "x-goog-api-key": key } })).json();
    others = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace("models/", ""))
      .filter(n => /flash/i.test(n) && !/image|tts|live|audio|embed|robotics/i.test(n) && n !== PRIMARY_MODEL).slice(0, 3);
  } catch {}
  for (const m of others) if (await tryModel(m, 0)) return;
  throw new Error("Modelele gratuite sunt aglomerate acum. Încearcă din nou peste un minut.");
}

function showKeyButton(){
  if (document.getElementById("keybtn")) return;
  const b = document.createElement("button");
  b.id = "keybtn"; b.type = "button"; b.className = "link"; b.textContent = "Schimbă cheia";
  b.onclick = () => { forgetKey(); alert("Cheia a fost ștearsă. Vei fi întrebat din nou la următorul mesaj."); };
  document.querySelector(".tools").prepend(b);
}

async function ask(text){
  text = (text || "").trim();
  if (!text || sendBtn.disabled) return;
  if (!history.length) msgsEl.innerHTML = "";
  history.push({ role: "user", content: text });
  addBubble("user", text);
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;
  const bubble = addBubble("assistant", "…");
  let acc = "";
  try {
    let r = null;
    if (!directMode) {
      try {
        r = await fetch("api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const ct = r.headers.get("content-type") || "";
        // Our backend answers with an event-stream or JSON; a static host answers with HTML or nothing.
        if (!ct.includes("event-stream") && !ct.includes("json")) r = null;
      } catch { r = null; }
      if (!r) directMode = true;
    }
    if (directMode) {
      showKeyButton();
      await directGemini(history, t => { acc += t; bubble.innerHTML = md(acc); logEl.scrollTop = logEl.scrollHeight; });
    } else {
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error || "Eroare de server");
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const p of parts) {
          if (!p.startsWith("data: ")) continue;
          const data = p.slice(6);
          if (data === "[DONE]") continue;
          const j = JSON.parse(data);
          if (j.error) throw new Error(j.error);
          acc += j.t || "";
          bubble.innerHTML = md(acc);
          logEl.scrollTop = logEl.scrollHeight;
        }
      }
    }
    history.push({ role: "assistant", content: acc });
    save();
  } catch (e) {
    history.pop();
    bubble.textContent = e.message;
    bubble.classList.add("err");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
document.getElementById("clear").onclick = () => {
  history = []; save(); renderEmpty();
};

renderAll();
const q = new URLSearchParams(location.search).get("q");
if (q) { history.length = 0; history = []; history_reset(); ask(q); }
function history_reset(){ msgsEl.innerHTML = ""; }
</script>
</body>
</html>
